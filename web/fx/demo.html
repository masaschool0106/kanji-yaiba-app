<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>漢字の刃 演出の試し</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 16px; font-family: 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif; background: #090d16; color: #e2e8f0; }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.note { font-size: 13px; color: #94a3b8; margin: 0 0 12px; line-height: 1.6; }
    #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #4c1d95; }
    #stage .idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 15px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { font: inherit; font-weight: bold; font-size: 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: #312e81; color: #fff; cursor: pointer; }
    button:hover:not(:disabled) { background: #4338ca; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.gold { background: #b45309; }
    button.red { background: #991b1b; }
    .meter { font-size: 12px; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚔️ 演出の試し（じゃんけん・サイコロ）</h1>
    <p class="note">ボタンを押すと演出が流れます。演出中に画面をタップすると早送りになります。<br>Chromebook で動きがなめらかか、「平均」が 50fps 以上かを見てください（60 に近いほど、なめらか）。</p>
    <div id="stage"><div class="idle" id="idle">ボタンを押してね</div></div>
    <div class="row">
      <button data-demo="win">✊ じゃんけん（勝ち）</button>
      <button data-demo="lose">✌️ じゃんけん（負け）</button>
      <button data-demo="rarity">🖐️ あいこ → レアリティ勝負</button>
      <button data-demo="draw">🤝 ひきわけ</button>
      <button data-demo="three">⚔️ 3回戦を続けて</button>
    </div>
    <div class="row">
      <button data-demo="dice">🎲 通常ダイス（返事を1.5秒待つ）</button>
      <button data-demo="six" class="gold">🎯 確定6ダイス</button>
      <button data-demo="bonus">🎲 ダイス＋レリック(+1)</button>
      <button data-demo="bossWin" class="red">👑 ボス勝負（勝ち）</button>
      <button data-demo="bossLose" class="red">👑 ボス勝負（負け）</button>
      <button data-demo="bossDraw" class="red">👑 ボス勝負（互角）</button>
    </div>
    <div class="row">
      <button id="soundBtn">🔊 効果音：オン</button>
    </div>
    <div class="meter" id="meter">fps：-</div>
  </div>

  <script src="fx.js"></script>
  <script>
    // 試し用のカード（軽い版がまだなければ元の画像を使う）
    const PAGES = 'https://masaschool0106.github.io/';
    const card = (id, name, rarity, hand, full) => ({ name, rarity, hand, imageUrl: `../assets/cards/${id}.webp`, imageUrlFull: PAGES + full });
    const C = {
      honoo: card(20, '庚・炎の柱', 'SSR', 'グー', 'kanji-yaiba-2025/028.gif'),
      kaminari: card(2, '乙・雷の柱', 'N+', 'チョキ', 'kanji-yaiba-2025/002.png'),
      akebono: card(5, '戊・曙の柱', 'SR', 'チョキ', 'kanji-yaiba-2025/005.png'),
      honooS: card(7, '庚・炎の柱', 'SSR', 'グー', 'kanji-yaiba-2025/007.png'),
      miyabi: card(10, '癸・雅の柱', 'LEGEND', 'グー', 'kanji-yaiba-2025/010.png'),
      tate: card(1, '甲・盾の柱', 'N', 'グー', 'kanji-yaiba-2025/001.png'),
      kiri: card(3, '丙・霧の柱', 'R', 'パー', 'kanji-yaiba-2025/003.png'),
      kiriA: card(16, '丙・霧の柱', 'R', 'パー', 'kanji-yaiba-2025/024.gif')
    };
    const BOSS = { name: '織田信長', imageUrl: '../assets/ijin/11.webp', imageUrlFull: PAGES + 'kannji-sugoroku/10.png' };
    const ROUNDS = {
      win: { round: 1, p1: C.honoo, p2: C.kaminari, winner: 1 },
      lose: { round: 2, p1: C.akebono, p2: C.honooS, winner: -1 },
      rarity: { round: 3, p1: C.miyabi, p2: C.tate, winner: 1 },
      draw: { round: 1, p1: C.kiri, p2: C.kiriA, winner: 0 }
    };

    const stage = document.getElementById('stage');
    const buttons = document.querySelectorAll('[data-demo]');
    let busy = false;

    async function run(name) {
      if (busy) return;
      busy = true; buttons.forEach((b) => b.disabled = true);
      document.getElementById('idle').hidden = true;
      startMeter();
      try {
        if (ROUNDS[name]) await KanjiFX.janken(stage, ROUNDS[name]);
        else if (name === 'three') { for (const k of ['win', 'lose', 'rarity']) await KanjiFX.janken(stage, ROUNDS[k]); }
        else if (name === 'dice') await KanjiFX.dice(stage, { value: new Promise((r) => setTimeout(() => r(1 + Math.floor(Math.random() * 5)), 1500)) });
        else if (name === 'six') await KanjiFX.dice(stage, { value: 6, golden: true });
        else if (name === 'bonus') await KanjiFX.dice(stage, { value: new Promise((r) => setTimeout(() => r(4), 800)), bonus: 1 });
        else if (name === 'bossWin') await KanjiFX.diceDuel(stage, { player: { value: 5, bonus: 2 }, boss: Object.assign({ value: 3 }, BOSS), result: 1, damage: 40, critical: true });
        else if (name === 'bossLose') await KanjiFX.diceDuel(stage, { player: { value: 2 }, boss: Object.assign({ value: 6 }, BOSS), result: -1, damage: 40 });
        else if (name === 'bossDraw') await KanjiFX.diceDuel(stage, { player: { value: 4 }, boss: Object.assign({ value: 4 }, BOSS), result: 0 });
      } catch (e) {
        console.error(e);
      } finally {
        stopMeter();
        document.getElementById('idle').hidden = false;
        busy = false; buttons.forEach((b) => b.disabled = false);
      }
    }
    buttons.forEach((b) => b.addEventListener('click', () => run(b.getAttribute('data-demo'))));

    // 効果音
    const soundBtn = document.getElementById('soundBtn');
    const showSound = () => { soundBtn.textContent = KanjiFX.soundOn() ? '🔊 効果音：オン' : '🔇 効果音：オフ'; };
    soundBtn.addEventListener('click', () => { KanjiFX.setSound(!KanjiFX.soundOn()); showSound(); });
    showSound();

    // なめらかさ（fps）の計測：演出中だけ数える
    let meterOn = false, frames = 0, worst = 0, startT = 0, lastT = 0;
    function startMeter() { meterOn = true; frames = 0; worst = 0; startT = lastT = performance.now(); requestAnimationFrame(tick); }
    function tick(t) {
      if (!meterOn) return;
      frames++; worst = Math.max(worst, t - lastT); lastT = t;
      requestAnimationFrame(tick);
    }
    function stopMeter() {
      meterOn = false;
      const sec = (performance.now() - startT) / 1000;
      document.getElementById('meter').textContent = `fps：平均 ${(frames / sec).toFixed(0)}　いちばん長い間 ${worst.toFixed(0)}ms（33ms 以下なら、カクつきはほぼ見えない）`;
    }
  </script>
</body>
</html>
